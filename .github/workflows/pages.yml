name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LIVE_URL: https://spirit-sculptor-tool.lovable.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          rm -f bun.lock
          bun install

      - name: Download media stored by Lovable and point the code to local copies
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          mkdir -p public/media
          node -e '
            const fs = require("fs"), path = require("path"), cp = require("child_process");
            const dir = "src/assets", base = process.argv[1], live = process.env.LIVE_URL;
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".asset.json"))) {
              const p = path.join(dir, f), j = JSON.parse(fs.readFileSync(p, "utf8"));
              const name = path.basename(j.url);
              cp.execFileSync("curl", ["-fsSL", "--retry", "3", "-o", "public/media/" + name, live + j.url], { stdio: "inherit" });
              j.url = base + "media/" + name;
              fs.writeFileSync(p, JSON.stringify(j, null, 2));
            }
          ' "$BASE"

      - name: Add router base path
        run: |
          sed -i 's/scrollRestoration: true,/scrollRestoration: true,\n    basepath: import.meta.env.BASE_URL,/' src/router.tsx

      - name: Build static site
        run: |
          PAGES_BUILD=1 PAGES_BASE="/${GITHUB_REPOSITORY#*/}/" bunx vite build
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
